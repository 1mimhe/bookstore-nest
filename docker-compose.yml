version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bookstore_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: bookstore-db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-pmysql']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bookstore_network

  redis:
    image: redis:7-alpine
    container_name: bookstore_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bookstore_network

  api:
    build:
      context: .
      target: dev
    container_name: bookstore_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: mysql
      DB_NAME: bookstore-db
      REDIS_URL: redis://:@redis:6379/0
      REDIS_VIEWS_URL: redis://:@redis:6379/1
      REDIS_SESSION_URL: redis://:@redis:6379/2
      SESSION_SECRET: Z3lp5qo3gYMNI85wUXYdtvkJByxUeTjC
      COOKIE_SECRET: 4i2MMy3piw8jIenh1l4XbltiHOOryDwj
      JWT_ACCESS_SECRET_KEY: hX84hTxLXocJn7J1HCfpL6XLVPNw3X9i
      JWT_REFRESH_SECRET_KEY: INCH3yhAx0ixMOHzXjHSlWrIKTG4UaDQ
    volumes:
      - .:/usr/app
      - /usr/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bookstore_network

volumes:
  mysql_data:
  redis_data:

networks:
  bookstore_network:
    driver: bridge
